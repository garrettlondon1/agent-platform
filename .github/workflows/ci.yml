name: ci

on:
  pull_request:
  push:
    branches: [ main ]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"
      - name: Build and test
        run: dotnet test tests/AgentPlatform.Tests -c Release
      - name: The example renders
        run: |
          dotnet run --project examples/contoso/Contoso.Platform.fsproj -c Release -- validate
          dotnet run --project examples/contoso/Contoso.Platform.fsproj -c Release --no-build -- render --out rendered --clean
      - name: Packages build
        run: |
          dotnet pack src/AgentPlatform -c Release -o out/packages
          dotnet pack templates/AgentPlatform.Templates.csproj -c Release -o out/packages
